<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冒泡排序 · Bubble Sort</title>
<style>
*{box-sizing:border-box}
:root{--paper:#f0efe9;--panel:#faf9f5;--ink:#171615;--muted:#62605a;--line:#d7d4cb;--red:#a73d2d}
body{margin:0;background:var(--paper);color:var(--ink);font:clamp(15px,1.25vw,20px)/1.55 Arial,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:9px max(4vw,16px);border-bottom:1px solid var(--line)}
header strong{font-size:13px;letter-spacing:.16em}header small{color:var(--muted);font-weight:400;letter-spacing:.08em}
main{width:min(1400px,92%);margin:auto;padding-top:16px}
nav,.tabs,.controls{display:flex;gap:6px;flex-wrap:wrap}
button,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--panel);padding:6px 12px;cursor:pointer}
button:hover{background:#e8e3d8}button:disabled{opacity:.42;cursor:default}
button[aria-current=true],.primary{background:var(--ink);border-color:var(--ink);color:white}
button[aria-current=true]:hover,.primary:hover{background:#39332e}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
nav button,header button{font-size:13px}
.heading{margin:21px 0 15px}.kicker,.label{font:700 11px/1.45 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.kicker:after{content:'';display:block;width:32px;height:3px;background:var(--red);margin:8px 0}
h1{font-size:clamp(31px,4vw,60px);line-height:1.06;letter-spacing:-.045em;margin:0}
h2{font-size:1.2em;margin:0 0 6px}p{margin:6px 0 11px}
.card{background:var(--panel);border:1px solid var(--line);padding:clamp(14px,2vw,25px);margin-top:12px}
.stage{padding:clamp(12px,1.55vw,22px)}
.step{background:#f2e5db;border-left:3px solid var(--red);color:#672a20;padding:9px 14px;min-height:44px;display:flex;align-items:center;gap:12px;font-weight:700}
.step .label{color:inherit;flex:none}.step.bad{background:#f3dfda}.step.good{background:#e7ece2;border-color:#537151;color:#314f34}
.tray-head{display:flex;justify-content:space-between;margin-top:12px}
.tray{display:flex;gap:6px;flex-wrap:wrap;min-height:34px;margin:6px 0}
.piece{background:var(--color);color:#201d19;font-weight:700;display:grid;place-items:center;white-space:nowrap}
.tray .piece{padding:4px 10px;min-width:48px;font-size:.85em;border:1px solid #0002}
.tray .done{background:#eeece5;color:#6b675f}.focus{outline:2px solid var(--red);outline-offset:1px}
.bins{--height:clamp(139px,26vh,300px);display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));gap:clamp(6px,2vw,28px);position:relative;max-width:820px;margin:16px auto 13px;padding-left:32px}
.scale{position:absolute;left:0;top:-8px;height:calc(var(--height) + 16px);display:flex;flex-direction:column;justify-content:space-between;color:var(--muted);font:12px ui-monospace,monospace}
.bin{min-width:0;text-align:center}.bin small{display:block;color:var(--muted);font-size:.76em}.bin .packed{color:#416343;font-weight:700}
.well{height:var(--height);border:1px solid #8e877a;display:flex;flex-direction:column-reverse;background:repeating-linear-gradient(to top,#fff 0,#fff calc(25% - 1px),#ece8df calc(25% - 1px),#ece8df 25%);margin-bottom:3px}
.well .piece{flex:none;min-height:0;box-shadow:inset 0 1px #0003;font-size:clamp(11px,1.35vw,20px)}
.bad .well{outline:3px solid #ac4934}.good .well{outline:3px solid #537151}.ghost .well{border-style:dashed;border-color:#c1baac}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:white}
.metric{padding:6px 10px;text-align:center}.metric+.metric{border-left:1px solid var(--line)}
.metric b{display:block;font-size:1.2em;font-variant-numeric:tabular-nums}.metric:last-child b{color:var(--red)}
.controls{align-items:center;margin-top:12px;font-size:.83em}.count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
progress{display:block;width:100%;height:4px;margin-top:10px;appearance:none;border:0;background:#e3dfd5;accent-color:var(--red)}
progress::-webkit-progress-bar{background:#e3dfd5}progress::-webkit-progress-value{background:var(--red)}
.working{margin-top:10px;padding:10px 15px;background:var(--ink);color:white}.working .label{color:#d3b3a5}.working p{margin:2px 0}
.notes{margin-top:12px;border:1px solid var(--line);padding:9px 14px;background:var(--panel)}.notes .card{border:0;padding:0;margin:10px 0 2px}
table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.8em;color:var(--muted)}td:first-child{font-weight:700;border-left:3px solid var(--red)}
footer{padding:14px 0;color:var(--muted);font-size:12px}details{margin:10px 0}summary{cursor:pointer;font-weight:700}
.formula{font-size:1.35em;color:var(--red);font-weight:800}.quiz{margin-bottom:12px}.quiz output{display:block;margin-top:8px}
.scene{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.scene div{background:white;border:1px solid var(--line);border-top:3px solid var(--red);padding:14px}.scene span{font-size:1.5em;display:block}
@media(max-width:620px){.step{align-items:flex-start;flex-direction:column;gap:2px}.tray .piece{padding:3px 5px;min-width:34px}.metric{padding:5px 2px}.metric .label{letter-spacing:0}.count{margin-left:0}}
.practice-board{margin:12px 0;background:#fffdf8;border:1px solid var(--line);border-top:3px solid var(--red);padding:14px 18px}
.practice-board summary{display:list-item}.practice-board h2{margin-top:12px}
.practice-board .prompt{margin:4px 0 12px}.practice-board .pick{min-width:58px}
.practice-board .pick[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}
.practice-board .actions{margin-top:10px}.practice-board output{display:block;margin-top:8px;font-weight:700}
.practice-board output:empty{display:none}.practice-board .success{color:#355c3d}.practice-board .retry{color:#8c3123}
.practice-board input{font:inherit;width:110px;padding:5px 8px;border:1px solid var(--line)}
.practice-board .selected{min-height:1.6em;margin-top:8px;color:var(--muted)}
.practice-board .label{display:block;margin-top:10px}
.row{display:grid;grid-template-columns:repeat(var(--size),minmax(0,1fr));gap:clamp(3px,1vw,12px);margin:18px 0}
.tile{text-align:center;background:#fff;border:1px solid var(--line);padding:clamp(5px,1vw,15px) 2px;font-size:clamp(16px,3vw,36px);font-weight:750;position:relative}
.tile:has(small){overflow-wrap:anywhere}.tile small{display:block;font:11px/1.5 Arial;color:var(--muted)}.tile.fixed{background:#e7ece2}.tile.active{border:2px solid var(--red);background:#f0dfd4;color:#762b21}
.place-names .tile{font-size:clamp(11px,1.75vw,25px)}.record{padding:3px 0;overflow-wrap:anywhere}.record+.record{border-top:1px solid #ffffff33}.working{min-height:72px}.feedback{min-height:1.6em;color:var(--red);margin:4px 0}.feedback:empty{display:none}
input{font:inherit;background:white;border:1px solid var(--line);padding:6px 10px;max-width:100%}.question{margin:10px 0}.stage .tabs{margin-top:8px}
</style>
<header><strong>SALLI <small> / DECISION MATHEMATICS 1</small></strong><button id="full">全屏投影</button></header>
<main><nav id="nav" aria-label="课件目录"></nav><article id="page"></article><footer>Pearson Edexcel · Decision Mathematics 1 · §1.3 · 印刷页 10–12</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const lessons=[
 {tab:'算法概念',title:'冒泡排序',sub:'BUBBLE SORT · §1.3 · P.10'},
 {tab:'例 7 · 升序',title:'升序排序',sub:'EXAMPLE 7 · P.11',data:[24,18,37,11,15,30],note:'将六个数字排成升序。第 3 趟结束时列表已经有序，第 4 趟没有交换，算法在这时确认完成。'},
 {tab:'例 8 · 字母',title:'字母排序',sub:'EXAMPLE 8 · P.11',data:[...'ALGORITHM'],limit:2,note:'(a) 从左到右逐对比较相邻字母，字母序正确就保留，否则交换。(b) 展示第一趟的全部 8 次比较。(c) 写出第二趟结束后的列表 A G L I O H M R T。'},
 {tab:'例 9 · 降序',title:'降序排序',sub:'EXAMPLE 9 · P.12',data:[39,57,72,39,17,24,48],descending:true,note:'左边小于右边时才交换。两个 39 是独立的项，相等时保留原顺序。第 5 趟无交换，确认完成。'},
 {tab:'课堂练习',title:'先做，再核对',sub:'EXERCISE 1C · P.12',practice:true},
 {tab:'卷面总结',title:'怎么写出完整过程',sub:'BUBBLE SORT · EXAM WORKING'}
];
const drills=[
 {label:'1(i) 数字',data:[23,16,15,34,18,25,11,19]},
 {label:'1(ii) 字母',data:[...'NETWORKS']},
 {label:'1(iii) 字母与编号',data:['A5','D3','D2','A1','B4','C7','C2','B3']},
 {label:'第 2 题 · 地名',data:['Chester','York','Stafford','Bridlington','Burton','Cranleigh','Evesham']}
];
function timeline(data,descending=false,limit=Infinity){
 const list=data.map((value,id)=>({value,id})), frames=[], records=[];
 const add=(type,pair,pass,bound,extra={})=>frames.push({type,pair,pass,bound,list:[...list],records:[...records],...extra});
 for(let bound=list.length,pass=1;bound>1&&pass<=limit;bound--,pass++){
   let swaps=0;
   for(let i=0;i<bound-1;i++){
     const a=list[i],b=list[i+1],swap=descending?a.value<b.value:a.value>b.value;
     add('compare',i,pass,bound,{swap, a:a.value,b:b.value});
     if(swap){[list[i],list[i+1]]=[b,a];swaps++;}
     add('result',i,pass,bound,{swap,a:a.value,b:b.value});
   }
   records.push({pass,values:list.map(x=>x.value).join(' · '),swaps});
   add('pass',-1,pass,swaps?bound-1:0,{swaps});
   if(!swaps)break;
 }
 return frames;
}
let page=0,drill=0,descending=false,manual=true,idx=0,frames=[],timer=null;
function stop(){
 clearInterval(timer);timer=null;
 if($('play'))$('play').textContent='自动播放';
}
function open(n){
 stop();page=n;idx=0;manual=true;
 const lesson=lessons[n];
 $('nav').innerHTML=lessons.map((l,i)=>'<button data-page="'+i+'" aria-current="'+(n===i)+'">'+l.tab+'</button>').join('');
 $('page').innerHTML='<div class="heading"><div class="kicker">'+lesson.sub+'</div><h1>'+lesson.title+'</h1></div>';
 if(n===0){
   $('page').innerHTML+='<section class="card"><h2>每次只比较相邻的两个值</h2><p>从左向右扫描 working list（工作区）。顺序正确就保留，顺序相反就交换，等值保留原顺序。走到工作区末尾就是一趟（pass）。</p><div class="scene"><div><b>升序 Ascending</b><p>左值大于右值才交换。每趟把当前最大值推到末尾。</p></div><div><b>降序 Descending</b><p>左值小于右值才交换。每趟把当前最小值推到末尾。</p></div><div><b>停止条件</b><p>一整趟没有交换就停止。工作区只剩一项时也已排序完成。</p></div></div><p><button class="primary" data-page="1">开始例 7 →</button></p></section>';return;
 }
 if(n===5){
   $('page').innerHTML+='<section class="card"><table><tr><th>卷面要求</th><th>应该写什么</th></tr><tr><td>Show every comparison</td><td>每次比较的两个值、交换或保留，以及交换后的列表。</td></tr><tr><td>After each pass</td><td>写出每趟结束后的完整列表，包括已经归位的部分。</td></tr><tr><td>No swaps</td><td>若某一趟没有交换，明确写出该趟无交换，列表已排序。</td></tr><tr><td>Repeated values</td><td>相等时保留，重复项各占一个位置。</td></tr></table></section>';return;
 }
 if(lesson.practice){
   const opts=drills.map((d,i)=>'<option value="'+i+'" '+(i===drill?'selected':'')+'>'+d.label+'</option>').join('');
   $('page').innerHTML+='<div class="tabs"><label>题目 <select id="drill">'+opts+'</select></label><label>方向 <select id="direction"><option value="up">升序</option><option value="down" '+(descending?'selected':'')+'>降序</option></select></label></div>';
 }
 const d=lesson.practice?drills[drill]:lesson;
 const down=lesson.practice?descending:lesson.descending;
 frames=timeline(d.data,down,lesson.limit);
 $('page').innerHTML+='<section class="card stage"><div class="tabs"><button id="manual" aria-current="true">自己判断</button><button id="demo" aria-current="false">看演示</button></div><div id="visual"></div><div class="controls"><button id="reset">重置</button><button id="prev">← 上一步</button><button id="play">自动播放</button><button id="next">下一步 →</button><span id="count" class="count"></span></div><progress id="progress" aria-label="演示进度"></progress></section>';
 if(lesson.note)$('page').innerHTML+='<details class="notes"><summary>题目讲解</summary><p>'+lesson.note+'</p></details>';
 if(lesson.practice)$('page').innerHTML+='<details class="notes"><summary>第 3 题 · 趟数推理</summary><p>对 n ≥ 2 的列表，想一想最少与最多要做几趟，以及什么样的排列能达到它们。</p><details><summary>核对推理</summary><p>最少 1 趟。已按升序排列时，第一趟无交换。最多 n − 1 趟，例如互异项严格降序，最小项每趟只向左移动一格，经过 n − 1 趟才到首位。</p></details></details>';
 if($('drill'))$('drill').onchange=e=>{drill=Number(e.target.value);if(drill===3)descending=false;open(4);};
 if($('direction')){$('direction').disabled=drill===3;$('direction').onchange=e=>{descending=e.target.value==='down';open(4);};}
 $('manual').onclick=()=>mode(true);$('demo').onclick=()=>mode(false);
 $('reset').onclick=()=>{stop();idx=0;render();};
 $('prev').onclick=()=>{stop();move(-1);};$('next').onclick=()=>{stop();move(1);};
 $('play').onclick=()=>{if(timer){stop();return;}if(idx===frames.length-1)idx=0;mode(false);$('play').textContent='暂停';timer=setInterval(()=>{move(1);if(idx===frames.length-1)stop();},1050);};
 render();
}
function mode(value){stop();manual=value;render();}
function move(delta){
 idx=Math.max(0,Math.min(frames.length-1,idx+delta));render(delta>0);
}
function render(animate=false){
 const f=frames[idx], here=$('visual'), lesson=lessons[page], down=lesson.practice?descending:lesson.descending;
 const prior=new Map([...here.querySelectorAll('[data-tile]')].map(e=>[e.dataset.tile,e.getBoundingClientRect()]));
 const final=idx===frames.length-1;
 const message=f.type==='compare'?'比较 '+f.a+' 与 '+f.b+'。'+(manual?'该交换还是保留？':f.swap?'顺序相反，下一步交换。':'顺序正确或相等，下一步保留。'):
   f.type==='result'?(f.swap?'已交换 ':'已保留 ')+f.a+' 与 '+f.b+'。':
   '第 '+f.pass+' 趟完成，'+(f.swaps?'交换 '+f.swaps+' 次。'+(final?(lesson.limit?' 已完成题目要求的两趟。':' 工作区只剩一项，排序完成。'):' 末尾一项归位。'):'没有交换，排序完成。');
 if(lesson.practice&&drill===3)here.classList.add("place-names");
 const tiles=f.list.map((x,i)=>'<div class="tile '+(i>=f.bound?'fixed ': '')+(i===f.pair||i===f.pair+1&&f.pair>=0?'active':'')+'" data-tile="'+x.id+'"><small>'+(i>=f.bound?'已归位':i+1)+'</small>'+x.value+'</div>').join('');
 here.innerHTML='<div class="step" role="status"><span class="label">PASS '+f.pass+' · '+(down?'降序':'升序')+'</span><span>'+message+'</span></div>'+
   '<div class="row" style="--size:'+f.list.length+'">'+tiles+'</div>'+
   (manual&&f.type==='compare'?'<div class="tabs"><button id="swap">交换 Swap</button><button id="keep">保留 Leave</button><button id="hint">提示</button></div><p class="feedback" id="feedback" aria-live="polite"></p>':'')+
   '<div class="working"><span class="label">卷面记录 · Exam working</span>'+
   (f.records.length?f.records.map(r=>'<div class="record">Pass '+r.pass+'　'+r.values+(r.swaps?'':'　· 无交换')+'</div>').join(''):'<p>每趟结束后，记录完整列表。</p>')+'</div>';
 if(animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
  for(const e of here.querySelectorAll('[data-tile]')){
   const start=prior.get(e.dataset.tile), end=e.getBoundingClientRect();
   if(start&&start.x!==end.x)e.animate([{transform:'translateX('+(start.x-end.x)+'px)'},{transform:'none'}],{duration:440,easing:'ease-out'});
  }
 }
 if($('swap')){
   const guess=value=>{if(value===f.swap){move(1);$('next').focus();}else $('feedback').textContent='再试一次。相等时也保留原顺序。';};
   $('swap').onclick=()=>guess(true);$('keep').onclick=()=>guess(false);
   $('hint').onclick=()=>{$('feedback').textContent=down?'降序时，左边小于右边才交换。':'升序时，左边大于右边才交换。';};
 }
 $('manual').setAttribute('aria-current',manual);$('demo').setAttribute('aria-current',!manual);
 $('prev').disabled=idx===0;$('next').disabled=final||manual&&f.type==='compare';
 $('count').textContent=(idx+1)+' / '+frames.length;$('progress').max=frames.length;$('progress').value=idx+1;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)open(Number(b.dataset.page));});
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('full').textContent='使用浏览器全屏';}};
document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'退出全屏':'全屏投影';});
open(0);
</script></html>
